[project]
name = "infoclass"
version = "0.1.0"
description = "Comment analysis pipeline for AIGC public opinion research."
requires-python = ">=3.13"
dependencies = [
    "bertopic==0.17.4",
    "hdbscan==0.8.42",
    "jieba==0.42.1",
    "matplotlib>=3.10,<3.11",
    "networkx==3.6.1",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pyecharts>=2.0,<3",
    "requests==2.33.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "sentence-transformers==5.4.1",
    "umap-learn==0.5.12",
    "wordcloud>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
